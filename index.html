<script>
// Sistema 100% offline - Bloqueo total de conexiones de red
(function() {
  'use strict';
  
  // Eliminar WebSocket y prevenir cualquier recreación
  if (typeof WebSocket !== 'undefined') {
    const wsProto = WebSocket.prototype;
    Object.defineProperty(window, 'WebSocket', {
      get: function() {
        return function() {
          throw new Error('WebSocket disabled - system runs offline');
        };
      },
      set: function() {},
      configurable: false
    });
  }
  
  // Eliminar Service Worker
  if ('serviceWorker' in navigator) {
    Object.defineProperty(navigator, 'serviceWorker', {
      get: function() {
        return undefined;
      },
      set: function() {},
      configurable: false
    });
  }
  
  // Interceptar y silenciar TODOS los errores de consola relacionados con WebSocket
  const originalError = console.error;
  const originalWarn = console.warn;
  
  function filterWebSocketError(args) {
    const message = args.join(' ');
    return message.includes('WebSocket') || message.includes('ws://') || message.includes('127.0.0.1:5501');
  }
  
  console.error = function(...args) {
    if (filterWebSocketError(args)) return;
    originalError.apply(console, args);
  };
  
  console.warn = function(...args) {
    if (filterWebSocketError(args)) return;
    originalWarn.apply(console, args);
  };
  
  // Interceptar errores globales no capturados relacionados con WebSocket
  window.addEventListener('error', function(e) {
    if (e.message && (e.message.includes('WebSocket') || e.message.includes('ws://'))) {
      e.preventDefault();
      e.stopPropagation();
      return false;
    }
  }, true);
  
  // Bloquear fetch a URLs específicas del entorno de desarrollo
  const originalFetch = window.fetch;
  window.fetch = function(url, options) {
    if (typeof url === 'string' && (url.includes('127.0.0.1:5501') || url.includes('ws://'))) {
      return Promise.reject(new Error('Network request blocked - system runs offline'));
    }
    return originalFetch.apply(this, arguments);
  };
})();
</script>
<script>
/* Only add manifest & favicon when served via HTTP — they cause CORS errors on file:// */
if (location.protocol !== 'file:') {
  const mf = document.createElement('link'); mf.rel = 'manifest'; mf.href = './manifest.json'; document.head.appendChild(mf);

<script>
window.togglePass=function(btn){
  const inp=document.getElementById('login-pass');
  const show=inp.type==='password';
  inp.type=show?'text':'password';
  btn.classList.toggle('pass-toggle--show',show);
  btn.setAttribute('aria-label',show?'Ocultar contraseña':'Mostrar contraseña');
}
window.forceClearAppCache = function() {
  if (confirm('¿Limpiar caché de la aplicación y forzar actualización?\n\nEsto resolverá problemas de contraseñas incorrectas o errores de carga limpiando los archivos antiguos guardados en el navegador.')) {
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (let name of names) {
          caches.delete(name);
        }
      });
    }
    try {
      localStorage.removeItem('hotelos_session');
    } catch(e) {}
    
    setTimeout(function() {
      const url = new URL(window.location.href);
      url.searchParams.set('reload_ts', String(Date.now()));
      window.location.replace(url.toString());
    }, 1000);
  }
}
</script>

<script>
  // Inicializar tema inmediatamente para evitar flash de contenido
  (function() {
    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.body.classList.add('dark-mode');
    }
  })();
</script>
<script>
// Fallback síncrono para window.toast — evita "window.toast is not a function"
// si el usuario hace login antes de que app.js/modules/ui.js termine de cargar.
// Será sobrescrito por modules/ui.js cuando éste se cargue.
if (typeof window.toast !== 'function') {
  window.toast = function(msg, type) {
    try {
      var c = document.getElementById('toast-container');
      if (c) {
        var t = document.createElement('div');
        t.className = 'toast ' + (type || 'info');
        t.textContent = msg;
        c.appendChild(t);
        setTimeout(function(){
          if (t.parentNode) {
            t.classList.add('removing');
            setTimeout(function(){ if (t.parentNode) t.parentNode.removeChild(t); }, 200);
          }
        }, type === 'error' ? 5000 : 3800);
        return;
      }
    } catch(e) {}
    if (type === 'error') console.error(msg); else console.log(msg);
  };
}
</script>
<script type="module">

</script>
<script>
(function () {
  function loadApp(build) {
    const s = document.createElement('script');
    s.type = 'module';
    s.src = build ? './app.js?v=' + encodeURIComponent(build) : './app.js';
    document.body.appendChild(s);
  }
  async function go() {
    try {
      if (window.StorageService && StorageService.init) await StorageService.init();
    } catch (e) {}
    try {
      if (window.location.protocol !== 'file:') {
        const vr = await fetch('./version.json?t=' + Date.now(), { cache: 'no-store' });
        if (vr.ok) {
          const vj = await vr.json();
          loadApp(vj && vj.build ? vj.build : '');
          return;
        }
      }
    } catch (e) {}
    loadApp('');
  }
  go();
})();
</script>
<script>
(function () {
  /* Sistema 100% offline - deshabilitar todas las solicitudes de red */
  return; // Sistema offline - no hacer solicitudes de red
})();
</script>
<script>
(function () {
  function bootBackup() {
    if (!window.BackupService || !BackupService.startAutoBackup || !BackupService.buildPayload) return;
    BackupService.startAutoBackup(function () { return BackupService.buildPayload(); }, 30 * 60 * 1000);
  }
  if (document.readyState === 'complete') setTimeout(bootBackup, 8000);
  else window.addEventListener('load', function () { setTimeout(bootBackup, 8000); });
})();
</script>
